[project]
name = "vikunja-mcp"
version = "0.1.0"
description = "Minimal Model Context Protocol server for a self-hosted Vikunja: list, read, create, close and comment tasks from Claude Code (or any MCP client)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
vikunja-mcp = "vikunja_mcp:main"
vikunja-mcp-init = "vikunja_mcp.init:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vikunja_mcp"]
